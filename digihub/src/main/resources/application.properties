spring.application.name=digihub
spring.profiles.default=dev

# --- Banco (Supabase PostgreSQL) - valores vêm de variáveis de ambiente ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1500000

# --- JPA: o esquema pertence ao Flyway, nunca ao Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Web ---
server.port=${PORT:8080}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.shutdown=graceful
spring.mvc.problemdetails.enabled=false

# --- CORS (origens explícitas, separadas por vírgula) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Actuator: apenas health, sem detalhes ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
